apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: demo-user
  namespace: kafka
  labels:
    strimzi.io/cluster: kafka
spec:
  authentication:
    type: scram-sha-512
  # No authorization block: authentication only. The demo topic is readable and
  # writable by any authenticated user because no authorizer is configured.
